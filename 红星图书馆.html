<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红星图书馆</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            color: #fff;
        }
        /* 背景设置 */
        .bg {
            position: fixed;
            inset: 0;
            background: url("https://p3-flow-imagex-sign.byteimg.com/ocean-cloud-tos/35e07090770a400199090770a4001990.jpeg~tplv-a9rns2rl98-image.png") center/cover no-repeat;
            z-index: -1;
        }
        /* 半透明毛玻璃容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 15px 30px;
            border-bottom: 3px solid #D90429;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            color: #FFD700;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }
        .nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.3s;
        }
        .nav a:hover { color: #D90429; }
        /* 书籍卡片区域 */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .book-card {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            border: 2px solid #D90429;
            border-radius: 8px;
            padding: 15px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .book-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(217, 4, 41, 0.5);
        }
        .book-title {
            color: #FFD700;
            font-size: 18px;
            margin: 10px 0;
        }
        .book-desc {
            font-size: 14px;
            color: #ddd;
            line-height: 1.5;
        }
        /* 苏联风装饰元素 */
        .star {
            color: #D90429;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <!-- 背景 -->
    <div class="bg"></div>

    <!-- 页面头部 -->
    <header>
        <div class="logo">
            <span class="star">★</span> 红星图书馆
        </div>
        <div class="nav">
            <a href="#">首页</a>
            <a href="#">书籍分类</a>
            <a href="#">我的书架</a>
            <a href="#">关于我们</a>
        </div>
    </header>

    <!-- 主体内容 -->
    <div class="container">
        <h2 style="margin: 30px 0 10px; text-shadow: 1px 1px 3px #000;">
            <span class="star">★</span> 推荐书籍
        </h2>
        <div class="books-grid">
            <!-- 书籍卡片1 -->
            <div class="book-card">
                <h3 class="book-title">钢铁是怎样炼成的</h3>
                <p class="book-desc">奥斯特洛夫斯基的经典著作，讲述保尔·柯察金的成长历程与革命精神。</p>
            </div>
            <!-- 书籍卡片2 -->
            <div class="book-card">
                <h3 class="book-title">青年近卫军</h3>
                <p class="book-desc">法捷耶夫的作品，描绘卫国战争中苏联青年的英雄事迹。</p>
            </div>
            <!-- 书籍卡片3 -->
            <div class="book-card">
                <h3 class="book-title">静静的顿河</h3>
                <p class="book-desc">肖洛霍夫的史诗巨著，展现顿河地区哥萨克的命运变迁。</p>
            </div>
            <!-- 书籍卡片4 -->
            <div class="book-card">
                <h3 class="book-title">毁灭</h3>
                <p class="book-desc">法捷耶夫的早期作品，记录国内战争时期的红军游击队故事。</p>
            </div>
        </div>
    </div>
</body>
</html>
